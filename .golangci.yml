version: "2"
linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      # Output to the terminal and cleanup of files and listeners have no
      # useful recovery.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - (net.Listener).Close
        - (*text/tabwriter.Writer).Flush
        - os.Remove
